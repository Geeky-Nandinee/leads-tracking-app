version: '3.8'

services:
  leads-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leads-tracking-portal
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/leads.db
      - ENABLE_BASIC_AUTH=false
      - BASIC_AUTH_USER=admin
      - BASIC_AUTH_PASS=secret123
    volumes:
      - leads-data:/app/data
    restart: unless-stopped

volumes:
  leads-data:
    driver: local
